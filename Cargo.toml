[workspace]
resolver = "3"
# In-process allocation counting links a pinned Redact Secret core and is
# built on its own (ADR 0002); it is not part of the neutral workspace.
exclude = ["measurements/redact-secret-alloc"]
members = [
    "crates/credential-eval-contracts",
    "crates/credential-eval-kernel",
    "crates/credential-eval-adapters",
    "crates/credential-eval-cli",
    "crates/credential-eval-compat",
    "crates/credential-eval-perf",
]

[workspace.package]
# Implementation version. The measurement protocol and artifact schema
# versions are separate constants in credential-eval-contracts.
version = "0.1.0-alpha.15"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
repository = "https://github.com/redact-secret/credential-eval"

[workspace.dependencies]
credential-eval-contracts = { path = "crates/credential-eval-contracts" }
credential-eval-kernel = { path = "crates/credential-eval-kernel" }
credential-eval-adapters = { path = "crates/credential-eval-adapters" }
credential-eval-compat = { path = "crates/credential-eval-compat" }
credential-eval-perf = { path = "crates/credential-eval-perf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
jsonschema = { version = "0.58", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
fancy-regex = { version = "0.19", default-features = false, features = ["std", "perf", "unicode"] }
url = "2"
tempfile = "3"
ctrlc = "3"
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Hashing scanner executables (TruffleHog is ~160 MiB) and regex matching are
# hot even in debug test runs; optimize those dependencies in every profile.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3
