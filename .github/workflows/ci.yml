name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain; rustup (preinstalled on the
      # runner) installs it and its components on first use.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the schema drift check (committed schemas/ must match the
      # contract types) and the contracts-smoke end-to-end golden artifact.
      - name: Test
        run: cargo test --workspace --locked

  # Reference qualification consumer (#6): proves a downstream policy can read
  # the run artifact through its JSON Schema alone. No npm dependencies.
  qualification-consumer:
    name: reference qualification consumer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Test
        run: node --test examples/qualification-consumer/consumer.test.mjs

      - name: Consume the smoke artifact
        run: >-
          node examples/qualification-consumer/consume.mjs
          --artifact tests/fixtures/contracts-smoke/expected-run-artifact.json
          > /dev/null
