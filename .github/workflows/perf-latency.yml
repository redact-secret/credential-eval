name: perf-latency

# Latency measurement of two pinned Redact Secret CLI builds (ADR 0002,
# kind 1), run on a hosted runner and never on a developer machine: a quiet
# host is part of the protocol. The A/A control inside each run measures the
# runner's own noise, and the artifact records the load average, the CPU model,
# the toolchain and both executables' digests. The result is a direction, not a
# budget, and a direction seen once is not a result: the measurement runs twice
# as independent jobs (separate VMs) and `perf confirm` reports a direction as
# confirmed only when both runs agree.

on:
  workflow_dispatch:
    inputs:
      baseline_revision:
        description: Redact Secret commit of the baseline build (arm A and its A/A control)
        required: true
        default: be5fee9597311ee01cb33bcdc5c064d5cbb667ff
      candidate_revision:
        description: Redact Secret commit of the candidate build (arm B)
        required: true
        default: ad877c036825a926f93478c2104e675d9c301326

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The engine is the instrument, not the thing measured: build it once and
  # share it with the jobs below (in this workflow run only).
  build:
    name: build the engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the engine
        run: cargo build --release --locked -p credential-eval-cli

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine
          path: target/release/credential-eval
          retention-days: 1
          if-no-files-found: error

  latency:
    name: latency run ${{ matrix.run }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine
          path: ${{ runner.temp }}/engine

      - name: Make the engine executable
        run: chmod +x "$RUNNER_TEMP/engine/credential-eval"

      # A scanner build is identified by its commit, which never changes, so
      # the cache key is the commit (plus the toolchain it was built with): it
      # cannot go stale, and a miss only rebuilds. The executable's SHA-256 is
      # still recorded by the run.
      - name: Restore scanner builds
        id: scanners
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/scanner-${{ inputs.baseline_revision }}
            ${{ runner.temp }}/scanner-${{ inputs.candidate_revision }}
          key: scanners-${{ runner.os }}-${{ inputs.baseline_revision }}-${{ inputs.candidate_revision }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Build the scanners
        if: steps.scanners.outputs.cache-hit != 'true'
        env:
          BASELINE: ${{ inputs.baseline_revision }}
          CANDIDATE: ${{ inputs.candidate_revision }}
        run: |
          set -euo pipefail
          for rev in "$BASELINE" "$CANDIDATE"; do
            [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit id: $rev"; exit 2; }
            [ -x "$RUNNER_TEMP/scanner-$rev/bin/redact-secret" ] ||
              cargo install --locked --git https://github.com/redact-secret/redact-secret \
                --rev "$rev" redact-secret-cli --root "$RUNNER_TEMP/scanner-$rev"
          done

      - name: Fill the configuration
        env:
          BASELINE: ${{ inputs.baseline_revision }}
          CANDIDATE: ${{ inputs.candidate_revision }}
        run: |
          set -euo pipefail
          rustc_version=$(rustc -vV | sed -n 's/^release: //p')
          llvm_version=$(rustc -vV | sed -n 's/^LLVM version: //p')
          sed \
            -e "s|__BASELINE_ID__|redact-secret-${BASELINE:0:8}|" \
            -e "s|__CANDIDATE_ID__|redact-secret-${CANDIDATE:0:8}|" \
            -e "s|__BASELINE_VERSION__|${BASELINE:0:8}|" \
            -e "s|__CANDIDATE_VERSION__|${CANDIDATE:0:8}|" \
            -e "s|__BASELINE_REVISION__|${BASELINE}|" \
            -e "s|__CANDIDATE_REVISION__|${CANDIDATE}|" \
            -e "s|__BASELINE_BIN__|$RUNNER_TEMP/scanner-${BASELINE}/bin/redact-secret|" \
            -e "s|__CANDIDATE_BIN__|$RUNNER_TEMP/scanner-${CANDIDATE}/bin/redact-secret|" \
            -e "s|__LLVM_VERSION__|${llvm_version}|" \
            -e "s|__RUSTC_VERSION__|${rustc_version}|" \
            configs/performance/redact-secret-latency.template.json > "$RUNNER_TEMP/performance-config.json"
          ! grep -q '__' "$RUNNER_TEMP/performance-config.json"

      - name: Measure
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/engine/credential-eval" perf run \
            --config "$RUNNER_TEMP/performance-config.json" \
            --out "$RUNNER_TEMP/performance-artifact.json" \
            --work-dir "$RUNNER_TEMP/perf-work" 2> "$RUNNER_TEMP/summary.txt"
          { echo '```'; cat "$RUNNER_TEMP/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-artifact-${{ matrix.run }}
          path: ${{ runner.temp }}/performance-artifact.json
          if-no-files-found: error

  confirm:
    name: confirmed directions
    needs: [build, latency]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine
          path: ${{ runner.temp }}/engine

      - name: Make the engine executable
        run: chmod +x "$RUNNER_TEMP/engine/credential-eval"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-artifact-*
          path: ${{ runner.temp }}/runs

      # Refuses runs that do not share a configuration, subjects and workloads,
      # and a run given twice.
      - name: Confirm
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/engine/credential-eval" perf confirm \
            --artifact "$RUNNER_TEMP/runs/performance-artifact-1/performance-artifact.json" \
            --artifact "$RUNNER_TEMP/runs/performance-artifact-2/performance-artifact.json" \
            --out "$RUNNER_TEMP/direction-confirmation.json" 2> "$RUNNER_TEMP/summary.txt"
          { echo '```'; cat "$RUNNER_TEMP/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: direction-confirmation
          path: ${{ runner.temp }}/direction-confirmation.json
          if-no-files-found: error
